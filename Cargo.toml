[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
description = "ReAct loop that calls an LLM and tools through caller-supplied ports."
readme = "README.md"

[dependencies]
agent-llm = "0.1.0"
serde_json = "1.0"

[dev-dependencies]
agent-llm = "0.1.0"
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt"] }
